name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Run tests
      run: go test -v -race ./...
      env:
        REDIS_URL: redis://localhost:6379

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Validate version format
      run: |
        if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Error: Version must be in format v1.0.0"
          exit 1
        fi

    - name: Create and push tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a ${{ inputs.version }} -m "Release ${{ inputs.version }}"
        git push origin ${{ inputs.version }}

    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

        # Generate changelog between tags
        if [ -z "$PREV_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s" --no-merges | head -20)
        else
          CHANGELOG=$(git log --pretty=format:"- %s" --no-merges ${PREV_TAG}..HEAD)
        fi

        # Create release notes
        cat > RELEASE_NOTES.md << EOF
        ## What's Changed

        ${CHANGELOG}

        ## Features
        - One-shot job scheduling
        - Recurring job scheduling
        - Exponential backoff with jitter
        - Global and per-domain concurrency limits
        - Automatic idempotency headers
        - REST API with Bearer token auth
        - Single binary deployment
        - Redis persistence

        ## Docker

        \`\`\`bash
        docker pull ghcr.io/cr0hn/tickhook:${{ inputs.version }}
        \`\`\`

        ## Quick Start

        \`\`\`bash
        # Download binary (Linux/amd64)
        wget https://github.com/cr0hn/tickhook/releases/download/${{ inputs.version }}/tickhook-linux-amd64
        chmod +x tickhook-linux-amd64

        # Run with Redis
        ./tickhook-linux-amd64 --redis-url redis://localhost:6379 --auth-token your-secret
        \`\`\`

        **Full Changelog**: https://github.com/cr0hn/tickhook/compare/${PREV_TAG}...${{ inputs.version }}
        EOF

    - name: Build binaries
      run: |
        mkdir -p dist
        VERSION=${{ inputs.version }}

        # Linux amd64
        GOOS=linux GOARCH=amd64 go build -ldflags="-w -s -X main.Version=${VERSION}" -o dist/tickhook-linux-amd64 ./cmd/tickhook

        # Linux arm64
        GOOS=linux GOARCH=arm64 go build -ldflags="-w -s -X main.Version=${VERSION}" -o dist/tickhook-linux-arm64 ./cmd/tickhook

        # Linux 386
        GOOS=linux GOARCH=386 go build -ldflags="-w -s -X main.Version=${VERSION}" -o dist/tickhook-linux-386 ./cmd/tickhook

        # Linux arm (32-bit, e.g., Raspberry Pi)
        GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-w -s -X main.Version=${VERSION}" -o dist/tickhook-linux-arm ./cmd/tickhook

        # macOS amd64 (Intel)
        GOOS=darwin GOARCH=amd64 go build -ldflags="-w -s -X main.Version=${VERSION}" -o dist/tickhook-darwin-amd64 ./cmd/tickhook

        # macOS arm64 (Apple Silicon)
        GOOS=darwin GOARCH=arm64 go build -ldflags="-w -s -X main.Version=${VERSION}" -o dist/tickhook-darwin-arm64 ./cmd/tickhook

        # Windows amd64
        GOOS=windows GOARCH=amd64 go build -ldflags="-w -s -X main.Version=${VERSION}" -o dist/tickhook-windows-amd64.exe ./cmd/tickhook

        # Windows 386
        GOOS=windows GOARCH=386 go build -ldflags="-w -s -X main.Version=${VERSION}" -o dist/tickhook-windows-386.exe ./cmd/tickhook

        # Windows arm64
        GOOS=windows GOARCH=arm64 go build -ldflags="-w -s -X main.Version=${VERSION}" -o dist/tickhook-windows-arm64.exe ./cmd/tickhook

        # FreeBSD amd64
        GOOS=freebsd GOARCH=amd64 go build -ldflags="-w -s -X main.Version=${VERSION}" -o dist/tickhook-freebsd-amd64 ./cmd/tickhook

        # Create checksums
        cd dist
        sha256sum * > checksums.txt
        cd ..

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.version }}
        name: ${{ inputs.version }}
        body_path: RELEASE_NOTES.md
        files: |
          dist/tickhook-*
          dist/checksums.txt
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/cr0hn/tickhook:${{ inputs.version }}
          ghcr.io/cr0hn/tickhook:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
