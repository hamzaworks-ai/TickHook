name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Run tests
      run: go test -v -race ./...
      env:
        REDIS_URL: redis://localhost:6379

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Extract version
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

        # Generate changelog between tags
        if [ -z "$PREV_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
        else
          CHANGELOG=$(git log --pretty=format:"- %s" --no-merges ${PREV_TAG}..HEAD)
        fi

        # Create release notes
        cat > RELEASE_NOTES.md << EOF
        ## What's Changed

        ${CHANGELOG}

        ## Features
        - ✅ One-shot job scheduling
        - ✅ Recurring job scheduling
        - ✅ Exponential backoff with jitter
        - ✅ Global and per-domain concurrency limits
        - ✅ Automatic idempotency headers
        - ✅ REST API with Bearer token auth
        - ✅ Single binary deployment
        - ✅ Redis persistence

        ## Docker

        \`\`\`bash
        docker pull ghcr.io/cr0hn/tickhook:${{ steps.get_version.outputs.VERSION }}
        \`\`\`

        ## Quick Start

        \`\`\`bash
        # Download binary (Linux/amd64)
        wget https://github.com/cr0hn/tickhook/releases/download/${{ steps.get_version.outputs.VERSION }}/tickhook-linux-amd64
        chmod +x tickhook-linux-amd64

        # Run with Redis
        ./tickhook-linux-amd64 --redis-url redis://localhost:6379 --auth-token your-secret
        \`\`\`

        **Full Changelog**: https://github.com/cr0hn/tickhook/compare/${PREV_TAG}...${{ steps.get_version.outputs.VERSION }}
        EOF

    - name: Build binaries
      run: |
        # Build for multiple platforms
        mkdir -p dist

        # Linux
        GOOS=linux GOARCH=amd64 go build -ldflags="-w -s -X main.Version=${{ steps.get_version.outputs.VERSION }}" -o dist/tickhook-linux-amd64 ./cmd/tickhook
        GOOS=linux GOARCH=arm64 go build -ldflags="-w -s -X main.Version=${{ steps.get_version.outputs.VERSION }}" -o dist/tickhook-linux-arm64 ./cmd/tickhook

        # macOS
        GOOS=darwin GOARCH=amd64 go build -ldflags="-w -s -X main.Version=${{ steps.get_version.outputs.VERSION }}" -o dist/tickhook-darwin-amd64 ./cmd/tickhook
        GOOS=darwin GOARCH=arm64 go build -ldflags="-w -s -X main.Version=${{ steps.get_version.outputs.VERSION }}" -o dist/tickhook-darwin-arm64 ./cmd/tickhook

        # Windows
        GOOS=windows GOARCH=amd64 go build -ldflags="-w -s -X main.Version=${{ steps.get_version.outputs.VERSION }}" -o dist/tickhook-windows-amd64.exe ./cmd/tickhook

        # Create checksums
        cd dist
        sha256sum * > checksums.txt
        cd ..

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: RELEASE_NOTES.md
        files: |
          dist/tickhook-*
          dist/checksums.txt
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/cr0hn/tickhook
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max