version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  tickhook:
    build: .
    ports:
      - "8080:8080"
    environment:
      - AUTH_TOKEN=change-me-in-production
    command:
      - --redis-url=redis://redis:6379
      - --auth-token=change-me-in-production
      - --bind=0.0.0.0:8080
      - --log-level=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
